version: "3"

vars:
  VERSION:
    sh: echo "1.0.$(date -u +%Y%m%d).$(date -u +%H%M)"

tasks:
  default:
    cmds:
      - task: windows

  generate:
    desc: 生成 Windows 资源文件（图标 + 版本号）
    cmds:
      - goversioninfo -file-version={{.VERSION}} -product-version={{.VERSION}} versioninfo.json
    sources:
      - versioninfo.json
      - assets/icon.ico
    generates:
      - resource.syso

  windows:
    desc: 构建 Windows amd64 版本
    deps:
      - generate
    cmds:
      - GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o vrtx.exe .
    generates:
      - vrtx.exe

  linux:
    desc: 构建 Linux amd64 版本
    cmds:
      - GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o vrtx .

  run:
    desc: 直接运行
    cmds:
      - go run .

  clean:
    desc: 清理构建产物
    cmds:
      - rm -f vrtx vrtx.exe resource.syso
