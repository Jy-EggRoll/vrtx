name: Package Development Release

on:
    pull_request: {}
    push:
        branches:
            - "**" # 任意分支的普通提交都构建开发版工件，方便测试下载
        tags:
            - "[0-9]+.[0-9]+.[0-9]+.dev.[0-9]+" # 匹配 x.y.z.dev.n 格式的开发版本标签（额外创建预发布）
    workflow_dispatch: # 支持手动运行

permissions:
    contents: write

jobs:
    build:
        name: Build portable packages
        runs-on: ubuntu-latest

        outputs:
            version: ${{ steps.get_version.outputs.version }}
            buildtime: ${{ steps.get_build_time.outputs.buildtime }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  # 始终以 go.mod 为 Go 版本的唯一来源，避免工作流与项目配置漂移
                  go-version-file: go.mod

            - name: Setup Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.x

            # goversioninfo 用于生成 Windows PE 资源（图标 + 版本号），本地由 mise 提供，CI 需显式安装
            - name: Install goversioninfo
              run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

            - name: Get version info
              id: get_version
              run: |
                  if [ "${{ github.ref_type }}" = "tag" ]; then
                    # 开发版标签触发时，直接使用 tag 作为版本号
                    VERSION=${GITHUB_REF#refs/tags/}
                    echo "Tag triggered - using tag version: $VERSION"
                  else
                    # 普通分支提交：以最近的正式版本号为基底，叠加分支名与日期构成开发版号
                    BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
                    SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
                    VERSION="${BASE}.dev.${SAFE_BRANCH}$(date +%Y%m%d)"
                    echo "Branch push - using dev version: $VERSION"
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Get build time
              id: get_build_time
              run: |
                  BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  echo "buildtime=$BUILDTIME" >> $GITHUB_OUTPUT

            # 发布构建必须先通过完整验证，失败时不会生成或上传产物
            - name: Verify source
              run: task verify

            - name: Build and package all platforms
              run: task package
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  BUILDTIME: ${{ steps.get_build_time.outputs.buildtime }}

            - name: Upload portable packages
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: build/*.zip
                  retention-days: 30

    installer:
        name: Build Windows installer
        runs-on: windows-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download portable packages
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            # zip 内为根级 vrtx.exe + ahk\ 目录，解压即得安装器所需的完整内容
            - name: Unpack portable package
              shell: pwsh
              run: Expand-Archive -Path "dist/vrtx-windows-amd64.zip" -DestinationPath "stage"

            - name: Install Inno Setup
              shell: pwsh
              run: choco install innosetup --no-progress -y

            - name: Compile installer
              shell: pwsh
              run: |
                  $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
                  & $iscc `
                      "/DStage=$PWD/stage" `
                      "/DAppVersion=${{ needs.build.outputs.version }}" `
                      "/O$PWD/dist" `
                      "packaging/vrtx-x64.iss"

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: installer
                  path: dist/vrtx-setup-*.exe
                  retention-days: 30
                  if-no-files-found: error

    release:
        name: Create release
        runs-on: ubuntu-latest
        needs: [build, installer]
        if: github.ref_type == 'tag' # 仅标签触发时创建发布；分支推送只产出可下载工件

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download portable packages
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: release/dist

            - name: Download installer
              uses: actions/download-artifact@v4
              with:
                  name: installer
                  path: release/setup

            - name: Generate release notes
              id: notes
              env:
                  VERSION: ${{ needs.build.outputs.version }}
              run: |
                  CUR="$VERSION"
                  PREV=$(git tag -l --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
                  {
                    echo "# VRTX v$CUR (开发版)"
                    echo ""
                    echo "- **Version**: $CUR"
                    echo "- **Build**: ${{ github.run_id }}"
                    echo "- **Commit**: ${{ github.sha }}"
                    echo ""
                    echo "> 开发版本仅供测试，可能包含不稳定或实验性功能。"
                    echo ""
                    if [ -n "$PREV" ]; then
                      echo "[Compare with $PREV](https://github.com/${{ github.repository }}/compare/$PREV...$CUR)"
                    else
                      echo "首次发布"
                    fi
                    echo ""
                    echo "---"
                    echo ""
                    echo "## 下载"
                    echo ""
                    echo "| 类型 | 架构 | 下载 |"
                    echo "|------|------|------|"
                    echo "| 安装器 | x64 | [vrtx-setup-x64.exe](https://github.com/${{ github.repository }}/releases/download/$CUR/vrtx-setup-x64.exe) |"
                    echo "| 便携版 | x64 | [vrtx-windows-amd64.zip](https://github.com/${{ github.repository }}/releases/download/$CUR/vrtx-windows-amd64.zip) |"
                    echo "| 便携版 | ARM64 | [vrtx-windows-arm64.zip](https://github.com/${{ github.repository }}/releases/download/$CUR/vrtx-windows-arm64.zip) |"
                  } > release_notes.md

            - name: Create development release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.build.outputs.version }}
                  name: "VRTX v${{ needs.build.outputs.version }} (开发版)"
                  body_path: release_notes.md
                  files: |
                      release/dist/*.zip
                      release/setup/*.exe
                  draft: false
                  prerelease: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
