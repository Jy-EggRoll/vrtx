# 该工作流只能通过正式版本的标签自动触发

name: Publish Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+" # 匹配 x.y.z 格式的正式版本标签

permissions:
    contents: write

jobs:
    build:
        name: Build portable packages
        runs-on: ubuntu-latest

        outputs:
            version: ${{ steps.get_version.outputs.version }}
            buildtime: ${{ steps.get_build_time.outputs.buildtime }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  # 始终以 go.mod 为 Go 版本的唯一来源，避免工作流与项目配置漂移
                  go-version-file: go.mod

            - name: Setup Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.x

            # goversioninfo 用于生成 Windows PE 资源（图标 + 版本号），本地由 mise 提供，CI 需显式安装
            - name: Install goversioninfo
              run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

            - name: Get version info
              id: get_version
              run: |
                  VERSION=${GITHUB_REF#refs/tags/}
                  echo "Publishing version: $VERSION"
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Get build time
              id: get_build_time
              run: |
                  BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  echo "buildtime=$BUILDTIME" >> $GITHUB_OUTPUT

            # 发布构建必须先通过完整验证，失败时不会生成或上传产物
            - name: Verify source
              run: task verify

            - name: Build and package all platforms
              run: task package
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  BUILDTIME: ${{ steps.get_build_time.outputs.buildtime }}

            - name: Upload portable packages
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: build/*.zip
                  retention-days: 90

    installer:
        name: Build Windows installer
        runs-on: windows-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download portable packages
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            # zip 内为根级 vrtx.exe + ahk\ 目录，解压即得安装器所需的完整内容
            - name: Unpack portable package
              shell: pwsh
              run: Expand-Archive -Path "dist/vrtx-windows-amd64.zip" -DestinationPath "stage"

            - name: Download Chinese language file
              shell: pwsh
              # 钉在 issrc 的具体 commit 上：该版本内容已验证适配 Inno Setup 6.x；
              # 升级编译器时随手动 bump 此 SHA
              run: Invoke-WebRequest `
                  -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/d588bab7409ebf7e598b24ce91249d64e9c89562/Files/Languages/ChineseSimplified.isl" `
                  -OutFile "packaging/ChineseSimplified.isl"

            - name: Install Inno Setup
              shell: pwsh
              run: choco install innosetup --no-progress -y

            - name: Compile installer
              shell: pwsh
              run: |
                  $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
                  & $iscc `
                      "/DStage=$PWD/stage" `
                      "/DAppVersion=${{ needs.build.outputs.version }}" `
                      "/O$PWD/dist" `
                      "packaging/vrtx-x64.iss"

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: installer
                  path: dist/vrtx-setup-*.exe
                  retention-days: 90
                  if-no-files-found: error

    release:
        name: Publish release
        runs-on: ubuntu-latest
        needs: [build, installer]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download portable packages
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: release/dist

            - name: Download installer
              uses: actions/download-artifact@v4
              with:
                  name: installer
                  path: release/setup

            - name: Generate release notes
              id: notes
              env:
                  VERSION: ${{ needs.build.outputs.version }}
              run: |
                  CUR="$VERSION"
                  PREV=$(git tag -l --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$CUR$" | head -n1)
                  {
                    echo "# VRTX v$CUR"
                    echo ""
                    echo "- **Version**: $CUR"
                    echo "- **Commit**: ${{ github.sha }}"
                    echo ""
                    if [ -n "$PREV" ]; then
                      echo "[Compare with $PREV](https://github.com/${{ github.repository }}/compare/$PREV...$CUR)"
                    else
                      echo "首次发布"
                    fi
                    echo ""
                    echo "---"
                    echo ""
                    echo "## 下载"
                    echo ""
                    echo "| 类型 | 架构 | 下载 |"
                    echo "|------|------|------|"
                    echo "| 安装器 | x64 | [vrtx-setup-x64.exe](https://github.com/${{ github.repository }}/releases/download/$CUR/vrtx-setup-x64.exe) |"
                    echo "| 便携版 | x64 | [vrtx-windows-amd64.zip](https://github.com/${{ github.repository }}/releases/download/$CUR/vrtx-windows-amd64.zip) |"
                    echo "| 便携版 | ARM64 | [vrtx-windows-arm64.zip](https://github.com/${{ github.repository }}/releases/download/$CUR/vrtx-windows-arm64.zip) |"
                    echo ""
                    echo "## ARM64 说明"
                    echo ""
                    echo "ARM64 构建并非全组件原生适配：AutoHotkey 解释器与拼音库等仍为 x64 版本，依赖 Windows 的 x64 转译层运行，可能存在不稳定或未知的问题。ARM64 设备建议直接使用压缩包（便携）版本。"
                  } > release_notes.md

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.build.outputs.version }}
                  name: "VRTX v${{ needs.build.outputs.version }}"
                  body_path: release_notes.md
                  files: |
                      release/dist/*.zip
                      release/setup/*.exe
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
