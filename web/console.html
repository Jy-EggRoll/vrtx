<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VRTX 控制台</title>
    <style>
      /* ============================================================
   Catppuccin 官方完整色板（4 主题 × 26 色）
   来源: https://catppuccin.com/palette/
   以后加颜色/主题直接在对应主题块里补一行即可
   ============================================================ */

      /* ---------- Latte (light) ---------- */
      :root {
        --ctp-rosewater: #dc8a78;
        --ctp-flamingo: #dd7878;
        --ctp-pink: #ea76cb;
        --ctp-mauve: #8839ef;
        --ctp-red: #d20f39;
        --ctp-maroon: #e64553;
        --ctp-peach: #fe640b;
        --ctp-yellow: #df8e1d;
        --ctp-green: #40a02b;
        --ctp-teal: #179299;
        --ctp-sky: #04a5e5;
        --ctp-sapphire: #209fb5;
        --ctp-blue: #1e66f5;
        --ctp-lavender: #7287fd;
        --ctp-text: #4c4f69;
        --ctp-subtext1: #5c5f77;
        --ctp-subtext0: #6c6f85;
        --ctp-overlay2: #7c7f93;
        --ctp-overlay1: #8c8fa1;
        --ctp-overlay0: #9ca0b0;
        --ctp-surface2: #acb0be;
        --ctp-surface1: #bcc0cc;
        --ctp-surface0: #ccd0da;
        --ctp-base: #eff1f5;
        --ctp-mantle: #e6e9ef;
        --ctp-crust: #dce0e8;
      }
      /* Latte 是浅色主题，深色模式下整体切换到 Frappé */
      @media (prefers-color-scheme: dark) {
        :root {
          --ctp-rosewater: #f2d5cf;
          --ctp-flamingo: #eebebe;
          --ctp-pink: #f4b8e4;
          --ctp-mauve: #ca9ee6;
          --ctp-red: #e78284;
          --ctp-maroon: #ea999c;
          --ctp-peach: #ef9f76;
          --ctp-yellow: #e5c890;
          --ctp-green: #a6d189;
          --ctp-teal: #81c8be;
          --ctp-sky: #99d1db;
          --ctp-sapphire: #85c1dc;
          --ctp-blue: #8caaee;
          --ctp-lavender: #babbf1;
          --ctp-text: #c6d0f5;
          --ctp-subtext1: #b5bfe2;
          --ctp-subtext0: #a5adce;
          --ctp-overlay2: #949cbb;
          --ctp-overlay1: #838ba7;
          --ctp-overlay0: #737994;
          --ctp-surface2: #626880;
          --ctp-surface1: #51576d;
          --ctp-surface0: #414559;
          --ctp-base: #303446;
          --ctp-mantle: #292c3c;
          --ctp-crust: #232634;
        }
      }

      /* ============================================================
   语义映射表（组件只允许用这一层变量）
   想换语义对应的颜色只改这里，不动组件样式
   ============================================================ */
      :root {
        /* 日志级别 → catppuccin 强调色 */
        --sem-info: var(--ctp-blue); /* 信息 */
        --sem-warn: var(--ctp-yellow); /* 警告 */
        --sem-error: var(--ctp-red); /* 错误 */
        --sem-fatal: var(--ctp-maroon); /* 致命（比 error 更深） */
        --sem-success: var(--ctp-green); /* 预留：成功 */
        --sem-debug: var(--ctp-sapphire); /* 预留：调试 */

        /* UI 中性色 → catppuccin 中性色 */
        --text: var(--ctp-text);
        --text-muted: var(--ctp-overlay1);
        --border: var(--ctp-surface1);
        --bg: var(--ctp-base);
        --surface: var(--ctp-surface0);
        --card: var(--ctp-mantle);
        --timestamp: var(--ctp-overlay1);
        --scrollbar: var(--ctp-surface2);
        --shadow: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shadow: rgba(0, 0, 0, 0.35);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family:
          "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        line-height: 1.55;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }

      /* 顶部标题栏卡片 */
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
        box-shadow: 0 2px 8px var(--shadow);
        position: sticky;
        top: 0;
        z-index: 10;
        flex-shrink: 0;
      }
      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header .badge {
        font-size: 11px;
        font-weight: 500;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--sem-info);
        color: var(--card);
      }

      /* 主内容区 */
      main {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
      }

      /* 日志卡片 */
      .log-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 2px 10px var(--shadow);
        overflow: hidden;
        min-height: 0;
      }
      .log-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-muted);
      }
      .log-header .count {
        font-variant-numeric: tabular-nums;
      }

      /* 日志列表 */
      #log-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px;
        font-family:
          "Cascadia Code", "JetBrains Mono", Consolas, "Microsoft YaHei",
          monospace;
        font-size: 12.5px;
        line-height: 1.7;
      }
      #log-list::-webkit-scrollbar {
        width: 8px;
      }
      #log-list::-webkit-scrollbar-track {
        background: transparent;
      }
      #log-list::-webkit-scrollbar-thumb {
        background: var(--scrollbar);
        border-radius: 4px;
      }
      #log-list::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      .log-entry {
        display: flex;
        gap: 10px;
        padding: 3px 0;
        border-bottom: 1px solid var(--border);
        animation: fadeIn 0.15s ease-out;
      }
      .log-entry:last-child {
        border-bottom: none;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .log-time {
        flex: 0 0 auto;
        color: var(--timestamp);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .log-level {
        flex: 0 0 auto;
        min-width: 52px;
        text-align: center;
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        border-radius: 3px;
        padding: 1px 6px;
      }
      .log-level.info {
        background: color-mix(in srgb, var(--sem-info) 15%, transparent);
        color: var(--sem-info);
      }
      .log-level.warn {
        background: color-mix(in srgb, var(--sem-warn) 15%, transparent);
        color: var(--sem-warn);
      }
      .log-level.error {
        background: color-mix(in srgb, var(--sem-error) 15%, transparent);
        color: var(--sem-error);
      }
      .log-level.fatal {
        background: color-mix(in srgb, var(--sem-fatal) 15%, transparent);
        color: var(--sem-fatal);
        font-weight: 700;
      }

      .log-msg {
        flex: 1;
        word-break: break-word;
        color: var(--text);
      }

      /* 底部提示栏 */
      footer {
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 10px 16px;
        text-align: center;
        font-size: 11.5px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      footer kbd {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 5px;
        font-family: inherit;
        font-size: 10.5px;
        color: var(--text);
      }

      /* 空状态 */
      .empty-hint {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        text-align: center;
        padding: 24px;
      }
      .empty-hint svg {
        width: 48px;
        height: 48px;
        margin-bottom: 10px;
        opacity: 0.5;
      }

      /* 响应式 */
      @media (max-width: 480px) {
        main {
          padding: 10px;
          gap: 8px;
        }
        header {
          padding: 10px 12px;
        }
        header h1 {
          font-size: 14px;
        }
        .log-header {
          padding: 8px 10px;
          font-size: 11px;
        }
        #log-list {
          padding: 10px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>VRTX 控制台 <span class="badge">实时</span></h1>
    </header>
    <main>
      <section class="log-card" aria-label="日志输出">
        <div class="log-header">
          <span>日志流</span>
          <span class="count" id="entry-count">0 条</span>
        </div>
        <div id="log-list" role="log" aria-live="polite" aria-atomic="false">
          <div class="empty-hint">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path
                d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M6.5 17H20V5a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 5.5v11A2.5 2.5 0 0 0 6.5 19H20"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>等待日志…</span>
          </div>
        </div>
      </section>
    </main>
    <footer>按 <kbd>Ctrl</kbd>+<kbd>L</kbd> 清空 · VRTX by EggRoll</footer>

    <script>
      (function () {
        "use strict";

        var EMPTY_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">' +
          '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="M6.5 17H20V5a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 5.5v11A2.5 2.5 0 0 0 6.5 19H20" stroke-linecap="round" stroke-linejoin="round"/>' +
          "</svg>";

        var ESC_MAP = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        };

        function escapeHtml(str) {
          return String(str).replace(/[&<>"']/g, function (c) {
            return ESC_MAP[c];
          });
        }

        var list = document.getElementById("log-list");
        var countEl = document.getElementById("entry-count");
        var entryCount = 0;

        function showEmpty(text) {
          list.innerHTML =
            '<div class="empty-hint">' +
            EMPTY_SVG +
            "<span>" +
            text +
            "</span></div>";
        }

        function hideEmpty() {
          var empty = list.querySelector(".empty-hint");
          if (empty) empty.remove();
        }

        function addEntry(e) {
          var level = e.level || "info";
          var div = document.createElement("div");
          div.className = "log-entry";
          div.innerHTML =
            '<span class="log-time">' +
            escapeHtml(e.time) +
            "</span>" +
            '<span class="log-level ' +
            escapeHtml(level) +
            '">' +
            escapeHtml(level) +
            "</span>" +
            '<span class="log-msg">' +
            escapeHtml(e.msg) +
            "</span>";
          hideEmpty();
          list.appendChild(div);
          entryCount++;
          countEl.textContent = entryCount + " 条";
          var nearBottom =
            list.scrollTop + list.clientHeight >= list.scrollHeight - 50;
          if (nearBottom) list.scrollTop = list.scrollHeight;
        }

        var es = new EventSource("/stream");
        es.onmessage = function (ev) {
          try {
            addEntry(JSON.parse(ev.data));
          } catch (err) {
            /* 忽略坏帧 */
          }
        };
        es.onerror = function () {
          es.close();
          showEmpty("连接已断开");
        };

        document.addEventListener("keydown", function (ev) {
          if (ev.ctrlKey && ev.key === "l") {
            ev.preventDefault();
            entryCount = 0;
            countEl.textContent = "0 条";
            showEmpty("已清空，等待日志…");
          }
        });
      })();
    </script>
  </body>
</html>
