<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VRTX 控制台</title>
    <style>
      /* ============================================================
   Catppuccin 官方完整色板（4 主题 × 26 色）
   来源: https://catppuccin.com/palette/
   以后加颜色/主题直接在对应主题块里补一行即可
   ============================================================ */

      /* ---------- Latte (light) ---------- */
      :root {
        --ctp-rosewater: #dc8a78;
        --ctp-flamingo: #dd7878;
        --ctp-pink: #ea76cb;
        --ctp-mauve: #8839ef;
        --ctp-red: #d20f39;
        --ctp-maroon: #e64553;
        --ctp-peach: #fe640b;
        --ctp-yellow: #df8e1d;
        --ctp-green: #40a02b;
        --ctp-teal: #179299;
        --ctp-sky: #04a5e5;
        --ctp-sapphire: #209fb5;
        --ctp-blue: #1e66f5;
        --ctp-lavender: #7287fd;
        --ctp-text: #4c4f69;
        --ctp-subtext1: #5c5f77;
        --ctp-subtext0: #6c6f85;
        --ctp-overlay2: #7c7f93;
        --ctp-overlay1: #8c8fa1;
        --ctp-overlay0: #9ca0b0;
        --ctp-surface2: #acb0be;
        --ctp-surface1: #bcc0cc;
        --ctp-surface0: #ccd0da;
        --ctp-base: #eff1f5;
        --ctp-mantle: #e6e9ef;
        --ctp-crust: #dce0e8;
      }
      /* Latte 是浅色主题，深色模式下整体切换到 Frappé */
      @media (prefers-color-scheme: dark) {
        :root {
          --ctp-rosewater: #f2d5cf;
          --ctp-flamingo: #eebebe;
          --ctp-pink: #f4b8e4;
          --ctp-mauve: #ca9ee6;
          --ctp-red: #e78284;
          --ctp-maroon: #ea999c;
          --ctp-peach: #ef9f76;
          --ctp-yellow: #e5c890;
          --ctp-green: #a6d189;
          --ctp-teal: #81c8be;
          --ctp-sky: #99d1db;
          --ctp-sapphire: #85c1dc;
          --ctp-blue: #8caaee;
          --ctp-lavender: #babbf1;
          --ctp-text: #c6d0f5;
          --ctp-subtext1: #b5bfe2;
          --ctp-subtext0: #a5adce;
          --ctp-overlay2: #949cbb;
          --ctp-overlay1: #838ba7;
          --ctp-overlay0: #737994;
          --ctp-surface2: #626880;
          --ctp-surface1: #51576d;
          --ctp-surface0: #414559;
          --ctp-base: #303446;
          --ctp-mantle: #292c3c;
          --ctp-crust: #232634;
        }
      }

      /* ============================================================
   语义映射表（组件只允许用这一层变量）
   想换语义对应的颜色只改这里，不动组件样式
   ============================================================ */
      :root {
        /* 日志级别 → catppuccin 强调色 */
        --sem-info: var(--ctp-blue); /* 信息 */
        --sem-warn: var(--ctp-yellow); /* 警告 */
        --sem-error: var(--ctp-red); /* 错误 */
        --sem-fatal: var(--ctp-maroon); /* 致命（比 error 更深） */
        --sem-success: var(--ctp-green); /* 预留：成功 */
        --sem-debug: var(--ctp-sapphire); /* 预留：调试 */

        /* UI 中性色 → catppuccin 中性色 */
        --text: var(--ctp-text);
        --text-muted: var(--ctp-overlay1);
        --border: var(--ctp-surface1);
        --bg: var(--ctp-base);
        --surface: var(--ctp-surface0);
        --card: var(--ctp-mantle);
        --timestamp: var(--ctp-overlay1);
        --scrollbar: var(--ctp-surface2);
        --shadow: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shadow: rgba(0, 0, 0, 0.35);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family:
          "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        line-height: 1.55;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }

      /* 顶部标题栏卡片 */
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
        box-shadow: 0 2px 8px var(--shadow);
        position: sticky;
        top: 0;
        z-index: 10;
        flex-shrink: 0;
      }
      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header .badge {
        font-size: 11px;
        font-weight: 500;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--sem-info);
        color: var(--card);
      }

      /* 主内容区 */
      main {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
      }

      /* 日志卡片 */
      .log-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 2px 10px var(--shadow);
        overflow: hidden;
        min-height: 0;
      }
      .log-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-muted);
      }
      .log-header .count {
        font-variant-numeric: tabular-nums;
      }

      /* 级别筛选 chips（按最低显示级别过滤） */
      .filters {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-left: auto;
        padding-right: 14px;
      }
      .chip {
        font-size: 10.5px;
        padding: 2px 9px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text-muted);
        cursor: pointer;
        font-family: inherit;
      }
      .chip:hover {
        border-color: var(--sem-info);
        color: var(--sem-info);
      }
      .chip.active {
        background: var(--sem-info);
        color: var(--card);
        border-color: transparent;
      }

      /* 日志列表 */
      #log-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px;
        font-family:
          "Cascadia Code", "JetBrains Mono", Consolas, "Microsoft YaHei",
          monospace;
        font-size: 12.5px;
        line-height: 1.7;
      }
      #log-list::-webkit-scrollbar {
        width: 8px;
      }
      #log-list::-webkit-scrollbar-track {
        background: transparent;
      }
      #log-list::-webkit-scrollbar-thumb {
        background: var(--scrollbar);
        border-radius: 4px;
      }
      #log-list::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      .log-entry {
        display: flex;
        gap: 10px;
        padding: 3px 0;
        border-bottom: 1px solid var(--border);
        animation: fadeIn 0.15s ease-out;
      }
      .log-entry:last-child {
        border-bottom: none;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .log-time {
        flex: 0 0 auto;
        color: var(--timestamp);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .log-level {
        flex: 0 0 auto;
        min-width: 52px;
        text-align: center;
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        border-radius: 3px;
        padding: 1px 6px;
      }
      .log-level.info {
        background: color-mix(in srgb, var(--sem-info) 15%, transparent);
        color: var(--sem-info);
      }
      .log-level.warn {
        background: color-mix(in srgb, var(--sem-warn) 15%, transparent);
        color: var(--sem-warn);
      }
      .log-level.error {
        background: color-mix(in srgb, var(--sem-error) 15%, transparent);
        color: var(--sem-error);
      }
      .log-level.fatal {
        background: color-mix(in srgb, var(--sem-fatal) 15%, transparent);
        color: var(--sem-fatal);
        font-weight: 700;
      }
      .log-level.debug {
        background: color-mix(in srgb, var(--sem-debug) 15%, transparent);
        color: var(--sem-debug);
      }

      .log-msg {
        flex: 1;
        word-break: break-word;
        color: var(--text);
      }

      /* 底部提示栏 */
      footer {
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 10px 16px;
        text-align: center;
        font-size: 11.5px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      footer kbd {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 5px;
        font-family: inherit;
        font-size: 10.5px;
        color: var(--text);
      }

      /* 空状态 */
      .empty-hint {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        text-align: center;
        padding: 24px;
      }
      .empty-hint svg {
        width: 48px;
        height: 48px;
        margin-bottom: 10px;
        opacity: 0.5;
      }

      /* 响应式 */
      @media (max-width: 480px) {
        main {
          padding: 10px;
          gap: 8px;
        }
        header {
          padding: 10px 12px;
        }
        header h1 {
          font-size: 14px;
        }
        .log-header {
          padding: 8px 10px;
          font-size: 11px;
        }
        #log-list {
          padding: 10px;
          font-size: 12px;
        }
      }
      /* 视图切换 */
      .view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .view.hidden { display: none; }

      /* 顶栏 Tab */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); }
      .tabs { display: flex; gap: 6px; }
      .tab {
        font-family: inherit;
        font-size: 12px;
        padding: 4px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text-muted);
        cursor: pointer;
      }
      .tab:hover { color: var(--sem-info); border-color: var(--sem-info); }
      .tab.active {
        background: var(--sem-info);
        border-color: transparent;
        color: var(--card);
      }

      /* 设置面板卡片 */
      .panel-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 2px 10px var(--shadow);
        overflow: hidden;
        min-height: 0;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-muted);
      }
      #save-status.ok { color: var(--sem-success); }
      #save-status.err { color: var(--sem-error); }

      .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      legend { font-size: 11.5px; color: var(--text-muted); padding: 0 6px; }

      .field {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 8px;
        border-left: 3px solid transparent;
        border-radius: 4px;
      }
      .field.modified { border-left-color: var(--sem-warn); background: color-mix(in srgb, var(--sem-warn) 8%, transparent); }
      .field input[type="checkbox"] { accent-color: var(--sem-info); width: 15px; height: 15px; cursor: pointer; }
      .field .lab { color: var(--text); min-width: 130px; }
      .field.row input[type="number"] {
        width: 90px;
      }
      .field.row.wide input[type="text"] { flex: 1; }
      .field input[type="text"], .field input[type="number"] {
        font-family: inherit;
        font-size: 12.5px;
        padding: 5px 8px;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .field input:focus { outline: none; border-color: var(--sem-info); }
      .hint { margin: -6px 0 0; font-size: 11px; color: var(--text-muted); }

      .reset-btn {
        margin-left: auto;
        font-family: inherit;
        font-size: 11px;
        width: 22px;
        height: 22px;
        line-height: 1;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text-muted);
        cursor: pointer;
        display: none;
      }
      .field.modified .reset-btn { display: inline-block; }
      .reset-btn:hover { color: var(--sem-warn); border-color: var(--sem-warn); }

      .actions { display: flex; gap: 10px; align-items: center; }
      .actions button {
        font-family: inherit;
        font-size: 12.5px;
        padding: 7px 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      .actions button:hover { border-color: var(--sem-info); color: var(--sem-info); }
      .actions button.primary {
        background: var(--sem-info);
        border-color: transparent;
        color: var(--card);
      }
      .actions button.danger:hover { border-color: var(--sem-error); color: var(--sem-error); }
    </style>
  </head>
  <body>
    <header>
      <h1>VRTX <span class="badge">实时</span></h1>
      <nav class="tabs">
        <button class="tab active" data-view="log" type="button">控制台</button>
        <button class="tab" data-view="settings" type="button">设置</button>
      </nav>
    </header>
    <main id="view-log" class="view">
      <section class="log-card" aria-label="日志输出">
        <div class="log-header">
          <span>日志流</span>
          <div class="filters" id="filters">
            <button class="chip active" data-min="all" type="button">全部</button>
            <button class="chip" data-min="info" type="button">INFO+</button>
            <button class="chip" data-min="warn" type="button">WARN+</button>
          </div>
          <span class="count" id="entry-count">0 条</span>
        </div>
        <div id="log-list" role="log" aria-live="polite" aria-atomic="false">
          <div class="empty-hint">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path
                d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M6.5 17H20V5a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 5.5v11A2.5 2.5 0 0 0 6.5 19H20"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>等待日志…</span>
          </div>
        </div>
      </section>
    </main>

    <main id="view-settings" class="view hidden">
      <section class="panel-card" aria-label="运行设置">
        <div class="panel-header">
          <span>运行设置</span>
          <span id="save-status"></span>
        </div>
        <div class="panel-body">
          <fieldset>
            <legend>提取类别</legend>
            <label class="field check">
              <input type="checkbox" data-key="extract.bookmarks"><span>浏览器书签</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.software"><span>软件快捷方式（开始菜单 / Windows Apps）</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.system"><span>系统位置快捷方式</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.drives"><span>磁盘盘符快捷方式</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.recent"><span>最近文件</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.office"><span>Office 最近文件</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.vscode"><span>VS Code 最近打开（本地 + 远程）</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
          </fieldset>

          <fieldset>
            <legend>监控</legend>
            <label class="field check">
              <input type="checkbox" data-key="watch"><span>启用监控模式（检测变更自动重建）</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <div class="field row">
              <span class="lab">轮询间隔（秒）</span>
              <input type="number" min="1" max="3600" data-key="interval_seconds">
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </div>
          </fieldset>

          <div class="field row wide">
            <span class="lab">输出目录（留空使用默认临时目录）</span>
            <input type="text" data-key="output_dir" placeholder="%TEMP%\VRTX" spellcheck="false">
            <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
          </div>
          <p class="hint">目录必须为空或仅含 VRTX 生成的内容；含其他文件的目录会被拒绝，绝不误删。</p>

          <div class="actions">
            <button id="btn-save" class="primary" type="button">保存并生效</button>
            <button id="btn-restore" type="button">恢复默认</button>
            <button id="btn-clean" class="danger" type="button">立即清理并重建</button>
          </div>
        </div>
      </section>
    </main>
    <footer>按 <kbd>Ctrl</kbd>+<kbd>L</kbd> 清空 · VRTX by EggRoll</footer>

    <script>
      (function () {
        "use strict";

        var EMPTY_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">' +
          '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="M6.5 17H20V5a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 5.5v11A2.5 2.5 0 0 0 6.5 19H20" stroke-linecap="round" stroke-linejoin="round"/>' +
          "</svg>";

        var ESC_MAP = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        };

        function escapeHtml(str) {
          return String(str).replace(/[&<>"']/g, function (c) {
            return ESC_MAP[c];
          });
        }

        var list = document.getElementById("log-list");
        var countEl = document.getElementById("entry-count");
        var entryCount = 0;

        /* 级别严重度排序，数值越大越严重；低于 minRank 的条目被隐藏 */
        var RANK = { debug: 0, info: 1, warn: 2, error: 3, fatal: 3 };
        var minRank = 0;

        function rankOf(level) {
          return RANK[level] !== undefined ? RANK[level] : 1;
        }

        function applyFilter() {
          var items = list.querySelectorAll(".log-entry");
          for (var i = 0; i < items.length; i++) {
            items[i].style.display =
              rankOf(items[i].dataset.level) >= minRank ? "" : "none";
          }
        }

        function showEmpty(text) {
          list.innerHTML =
            '<div class="empty-hint">' +
            EMPTY_SVG +
            "<span>" +
            text +
            "</span></div>";
        }

        function hideEmpty() {
          var empty = list.querySelector(".empty-hint");
          if (empty) empty.remove();
        }

        function addEntry(e) {
          var level = e.level || "info";
          var div = document.createElement("div");
          div.className = "log-entry";
          div.innerHTML =
            '<span class="log-time">' +
            escapeHtml(e.time) +
            "</span>" +
            '<span class="log-level ' +
            escapeHtml(level) +
            '">' +
            escapeHtml(level) +
            "</span>" +
            '<span class="log-msg">' +
            escapeHtml(e.msg) +
            "</span>";
          hideEmpty();
          if (rankOf(level) < minRank) div.style.display = "none";
          div.dataset.level = level;
          list.appendChild(div);
          entryCount++;
          countEl.textContent = entryCount + " 条";
          var nearBottom =
            list.scrollTop + list.clientHeight >= list.scrollHeight - 50;
          if (nearBottom) list.scrollTop = list.scrollHeight;
        }

        var es = new EventSource("/stream");
        es.onmessage = function (ev) {
          try {
            addEntry(JSON.parse(ev.data));
          } catch (err) {
            /* 忽略坏帧 */
          }
        };
        es.onerror = function () {
          es.close();
          showEmpty("连接已断开");
        };

        document.addEventListener("keydown", function (ev) {
          if (ev.ctrlKey && ev.key === "l") {
            ev.preventDefault();
            entryCount = 0;
            countEl.textContent = "0 条";
            showEmpty("已清空，等待日志…");
          }
        });

        /* 级别筛选 chips：点击切换最低显示级别 */
        var filters = document.getElementById("filters");
        if (filters) {
          filters.addEventListener("click", function (ev) {
            var btn = ev.target.closest(".chip");
            if (!btn) return;
            var chips = filters.querySelectorAll(".chip");
            for (var i = 0; i < chips.length; i++) {
              chips[i].classList.toggle("active", chips[i] === btn);
            }
            minRank = btn.dataset.min === "all" ? 0 : rankOf(btn.dataset.min);
            applyFilter();
          });
        }

        /* ================= 设置面板 ================= */
        var KEYS = [
          "extract.bookmarks", "extract.software", "extract.system",
          "extract.drives", "extract.recent", "extract.office", "extract.vscode",
          "watch", "interval_seconds", "output_dir"
        ];
        var viewLog = document.getElementById("view-log");
        var viewSettings = document.getElementById("view-settings");
        var statusEl = document.getElementById("save-status");
        var curCfg = null, defCfg = null, modMap = {};

        function showView(name) {
          var isSettings = name === "settings";
          viewLog.classList.toggle("hidden", isSettings);
          viewSettings.classList.toggle("hidden", !isSettings);
          var tabs = document.querySelectorAll(".tab");
          for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle("active", tabs[i].dataset.view === name);
          }
        }
        var tabBtns = document.querySelectorAll(".tab");
        for (var ti = 0; ti < tabBtns.length; ti++) {
          tabBtns[ti].addEventListener("click", function () {
            location.hash = this.dataset.view === "settings" ? "#settings" : "";
            showView(this.dataset.view);
          });
        }
        window.addEventListener("hashchange", function () {
          showView(location.hash === "#settings" ? "settings" : "log");
        });
        showView(location.hash === "#settings" ? "settings" : "log");

        function getPath(o, p) {
          var ks = p.split("."), t = o;
          for (var i = 0; i < ks.length; i++) {
            if (t == null) return undefined;
            t = t[ks[i]];
          }
          return t;
        }
        function setPath(o, p, v) {
          var ks = p.split("."), t = o;
          for (var i = 0; i < ks.length - 1; i++) t = t[ks[i]];
          t[ks[ks.length - 1]] = v;
        }

        function setStatus(msg, ok) {
          if (!msg) { statusEl.textContent = ""; return; }
          statusEl.textContent = msg;
          statusEl.className = ok ? "ok" : "err";
          setTimeout(function () { statusEl.textContent = ""; }, 3000);
        }

        function fillForm(cfg) {
          for (var i = 0; i < KEYS.length; i++) {
            var el = document.querySelector('[data-key="' + KEYS[i] + '"]');
            if (!el) continue;
            var v = getPath(cfg, KEYS[i]);
            if (el.type === "checkbox") el.checked = !!v;
            else el.value = v === undefined || v === null ? "" : v;
          }
          renderMarks();
        }

        /* 修改标记：黄条 + 单项重置按钮，仅对「当前值 ≠ 默认值」的项显示 */
        function renderMarks() {
          var rows = document.querySelectorAll("#view-settings .field");
          for (var i = 0; i < rows.length; i++) {
            var el = rows[i].querySelector("[data-key]");
            if (!el) continue;
            var mod = !!modMap[el.dataset.key];
            rows[i].classList.toggle("modified", mod);
            var btn = rows[i].querySelector(".reset-btn");
            if (btn) btn.style.display = mod ? "" : "none";
          }
        }

        function setControl(el, v) {
          if (el.type === "checkbox") el.checked = !!v;
          else el.value = v === undefined || v === null ? "" : v;
        }

        function loadSettings() {
          fetch("/api/config")
            .then(function (r) { return r.json(); })
            .then(function (d) {
              curCfg = d.config; defCfg = d.defaults; modMap = d.modified || {};
              var ae = document.activeElement;
              var editing = ae && ae.closest && ae.closest("#view-settings") && ae.dataset && ae.dataset.key;
              // 正在编辑的控件不被轮询覆盖；其余回显最新值
              for (var i = 0; i < KEYS.length; i++) {
                var k = KEYS[i];
                var el = document.querySelector('[data-key="' + k + '"]');
                if (!el || (editing && ae === el)) continue;
                setControl(el, getPath(curCfg, k));
              }
              renderMarks();
            })
            .catch(function () {});
        }

        function collect() {
          var c = JSON.parse(JSON.stringify(curCfg));
          for (var i = 0; i < KEYS.length; i++) {
            var k = KEYS[i];
            var el = document.querySelector('[data-key="' + k + '"]');
            if (!el) continue;
            var v;
            if (el.type === "checkbox") v = el.checked;
            else if (k === "interval_seconds") v = parseInt(el.value, 10) || 0;
            else v = el.value;
            setPath(c, k, v);
          }
          return c;
        }

        function save() {
          if (!curCfg || !defCfg) { setStatus("配置尚未加载，请稍候", false); return; }
          fetch("/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(collect())
          }).then(function (r) {
            if (r.ok) { setStatus("已保存并生效 ✓", true); loadSettings(); }
            else r.text().then(function (t) { setStatus(t || "保存失败", false); });
          }).catch(function () { setStatus("保存失败（服务不可达）", false); });
        }

        document.getElementById("btn-save").addEventListener("click", save);

        document.getElementById("btn-restore").addEventListener("click", function () {
          for (var i = 0; i < KEYS.length; i++) {
            var el = document.querySelector('[data-key="' + KEYS[i] + '"]');
            if (el) setControl(el, getPath(defCfg, KEYS[i]));
          }
          save();
        });

        document.getElementById("btn-clean").addEventListener("click", function () {
          fetch("/api/clean", { method: "POST" })
            .then(function (r) {
              if (r.ok) setStatus("已开始清理并重建，详见控制台日志", true);
              else r.text().then(function (t) { setStatus(t || "清理失败", false); });
            })
            .catch(function () { setStatus("清理失败（服务不可达）", false); });
        });

        /* 单项重置：该项写回默认值并立即保存生效 */
        var resetBtns = document.querySelectorAll("#view-settings .reset-btn");
        for (var ri = 0; ri < resetBtns.length; ri++) {
          resetBtns[ri].addEventListener("click", function (ev) {
            ev.stopPropagation();
            var row = this.closest(".field");
            var el = row && row.querySelector("[data-key]");
            if (!el || !defCfg) return;            setControl(el, getPath(defCfg, el.dataset.key));
            save();
          });
        }

        /* 面板可见期间轻量轮询：同步外部手改 config.json 带来的变化 */
        setInterval(function () {
          if (!viewSettings.classList.contains("hidden")) loadSettings();
        }, 4000);
        loadSettings();
      })();
    </script>
  </body>
</html>
