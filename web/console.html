<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VRTX 控制台</title>
    <style>
      /* ============================================================
   极简中性主题：不依赖任何第三方色板。
   只保留「中性灰阶」与「日志级别语义色」两组变量，
   组件一律引用变量，禁止硬编码色值；深浅色随系统偏好自动切换。
   ============================================================ */
      :root {
        color-scheme: light dark;

        /* 中性灰阶 */
        --bg: #ffffff;
        --surface: #f6f7f9;
        --border: #e4e6ea;
        --text: #1f2328;
        --text-muted: #6b7280;
        --timestamp: #8b949e;
        --scrollbar: #d0d4da;
        --on-accent: #ffffff;

        /* 日志级别语义色 */
        --sem-info: #2563eb;
        --sem-warn: #9a6700;
        --sem-error: #cf222e;
        --sem-fatal: #a40e26;
        --sem-success: #1a7f37;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --surface: #161b22;
          --border: #30363d;
          --text: #e6edf3;
          --text-muted: #8b949e;
          --timestamp: #8b949e;
          --scrollbar: #3d444d;
          --on-accent: #0d1117;

          --sem-info: #58a6ff;
          --sem-warn: #d29922;
          --sem-error: #f85149;
          --sem-fatal: #ff7b72;
          --sem-success: #3fb950;
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family:
          "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        line-height: 1.55;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }

      /* 顶部标题栏 */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: 10px 16px;
        position: sticky;
        top: 0;
        z-index: 10;
        flex-shrink: 0;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 400;
        color: var(--text-muted);
      }
      header .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--sem-info);
      }

      /* 主内容区 */
      main {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
      }

      /* 日志 / 设置容器（共用外观） */
      .log-card,
      .panel-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        min-height: 0;
      }
      .log-header,
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-muted);
      }
      .log-header .count {
        font-variant-numeric: tabular-nums;
      }

      /* 级别筛选 chips（按最低显示级别过滤） */
      .filters {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-left: auto;
        padding-right: 14px;
      }
      .chip {
        font-size: 11px;
        padding: 2px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-family: inherit;
      }
      .chip:hover {
        color: var(--text);
      }
      .chip.active {
        border-color: var(--sem-info);
        color: var(--sem-info);
      }

      /* 日志列表 */
      #log-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
        font-family:
          "Cascadia Code", "JetBrains Mono", Consolas, "Microsoft YaHei",
          monospace;
        font-size: 12.5px;
        line-height: 1.7;
      }
      #log-list::-webkit-scrollbar {
        width: 8px;
      }
      #log-list::-webkit-scrollbar-track {
        background: transparent;
      }
      #log-list::-webkit-scrollbar-thumb {
        background: var(--scrollbar);
        border-radius: 4px;
      }
      #log-list::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      .log-entry {
        display: flex;
        gap: 10px;
        padding: 2px 0;
      }

      .log-time {
        flex: 0 0 auto;
        color: var(--timestamp);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .log-level {
        flex: 0 0 auto;
        min-width: 46px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .log-level.info {
        color: var(--sem-info);
      }
      .log-level.warn {
        color: var(--sem-warn);
      }
      .log-level.error {
        color: var(--sem-error);
      }
      .log-level.fatal {
        color: var(--sem-fatal);
      }

      .log-msg {
        flex: 1;
        word-break: break-word;
        color: var(--text);
      }

      /* 底部提示栏 */
      footer {
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 10px 16px;
        text-align: center;
        font-size: 11.5px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      footer kbd {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        font-family: inherit;
        font-size: 10.5px;
        color: var(--text);
      }

      /* 空状态 */
      .empty-hint {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        text-align: center;
        padding: 24px;
      }
      .empty-hint svg {
        width: 48px;
        height: 48px;
        margin-bottom: 10px;
        opacity: 0.5;
      }

      /* 响应式 */
      @media (max-width: 480px) {
        main {
          padding: 10px;
          gap: 8px;
        }
        header {
          padding: 10px 12px;
        }
        header h1 {
          font-size: 14px;
        }
        .log-header {
          padding: 8px 10px;
          font-size: 11px;
        }
        #log-list {
          padding: 10px;
          font-size: 12px;
        }
      }
      /* 视图切换 */
      .view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .view.hidden {
        display: none;
      }

      /* 顶栏 Tab */
      .tabs {
        display: flex;
        gap: 4px;
      }
      .tab {
        font-family: inherit;
        font-size: 12.5px;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.active {
        background: var(--surface);
        border-color: var(--border);
        color: var(--text);
      }

      #save-status.ok {
        color: var(--sem-success);
      }
      #save-status.err {
        color: var(--sem-error);
      }

      .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      legend {
        font-size: 11.5px;
        color: var(--text-muted);
        padding: 0 6px;
      }

      .field {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 8px;
        border-left: 3px solid transparent;
        border-radius: 4px;
      }
      .field.modified {
        border-left-color: var(--sem-warn);
        background: color-mix(in srgb, var(--sem-warn) 8%, transparent);
      }
      .field input[type="checkbox"] {
        accent-color: var(--sem-info);
        width: 15px;
        height: 15px;
        cursor: pointer;
      }
      .field .lab {
        color: var(--text);
        min-width: 130px;
      }
      .field.row input[type="number"] {
        width: 90px;
      }
      .field input[type="text"],
      .field input[type="number"] {
        font-family: inherit;
        font-size: 12.5px;
        padding: 5px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .field input:focus {
        outline: none;
        border-color: var(--sem-info);
      }

      .reset-btn {
        margin-left: auto;
        font-family: inherit;
        font-size: 12px;
        width: 22px;
        height: 22px;
        line-height: 1;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        display: none;
      }
      .field.modified .reset-btn {
        display: inline-block;
      }
      .reset-btn:hover {
        color: var(--sem-warn);
        border-color: var(--sem-warn);
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .actions button {
        font-family: inherit;
        font-size: 12.5px;
        padding: 7px 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      .actions button:hover {
        background: var(--surface);
      }
      .actions button.primary {
        background: var(--sem-info);
        border-color: transparent;
        color: var(--on-accent);
      }
      .actions button.danger:hover {
        background: transparent;
        border-color: var(--sem-error);
        color: var(--sem-error);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>VRTX <span class="badge">实时</span></h1>
      <nav class="tabs">
        <button class="tab active" data-view="log" type="button">控制台</button>
        <button class="tab" data-view="settings" type="button">设置</button>
      </nav>
    </header>
    <main id="view-log" class="view">
      <section class="log-card" aria-label="日志输出">
        <div class="log-header">
          <span>日志流</span>
          <div class="filters" id="filters">
            <button class="chip active" data-min="info" type="button">INFO+</button>
            <button class="chip" data-min="warn" type="button">WARN+</button>
          </div>
          <span class="count" id="entry-count">0 条</span>
        </div>
        <div id="log-list" role="log" aria-live="polite" aria-atomic="false">
          <div class="empty-hint">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path
                d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M6.5 17H20V5a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 5.5v11A2.5 2.5 0 0 0 6.5 19H20"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>等待日志…</span>
          </div>
        </div>
      </section>
    </main>

    <main id="view-settings" class="view hidden">
      <section class="panel-card" aria-label="运行设置">
        <div class="panel-header">
          <span>运行设置</span>
          <span id="save-status"></span>
        </div>
        <div class="panel-body">
          <fieldset>
            <legend>提取类别</legend>
            <label class="field check">
              <input type="checkbox" data-key="extract.bookmarks"><span>浏览器书签</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.software"><span>软件快捷方式（开始菜单 / Windows Apps）</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.system"><span>系统位置快捷方式</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.drives"><span>磁盘盘符快捷方式</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.recent"><span>最近文件</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <label class="field check">
              <input type="checkbox" data-key="extract.office"><span>Office 最近文件</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
          </fieldset>

          <fieldset>
            <legend>监控与集成</legend>
            <label class="field check">
              <input type="checkbox" data-key="watch"><span>启用监控模式（检测变更自动重建）</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
            <div class="field row">
              <span class="lab">轮询间隔（秒）</span>
              <input type="number" min="1" max="3600" data-key="interval_seconds">
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </div>
            <label class="field check">
              <input type="checkbox" data-key="ahk"><span>启动时拉起 AutoHotkey 脚本（需 UAC 授权，退出时自动结束）</span>
              <button type="button" class="reset-btn" title="恢复此项默认值">↺</button>
            </label>
          </fieldset>

          <div class="actions">
            <button id="btn-save" class="primary" type="button">保存并生效</button>
            <button id="btn-restore" type="button">恢复默认</button>
            <button id="btn-clean" class="danger" type="button">立即清理并重建</button>
          </div>
        </div>
      </section>
    </main>
    <footer>按 <kbd>Ctrl</kbd>+<kbd>L</kbd> 清空 · VRTX by EggRoll</footer>

    <script>
      (function () {
        "use strict";

        var EMPTY_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">' +
          '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="M6.5 17H20V5a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 5.5v11A2.5 2.5 0 0 0 6.5 19H20" stroke-linecap="round" stroke-linejoin="round"/>' +
          "</svg>";

        var ESC_MAP = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        };

        function escapeHtml(str) {
          return String(str).replace(/[&<>"']/g, function (c) {
            return ESC_MAP[c];
          });
        }

        var list = document.getElementById("log-list");
        var countEl = document.getElementById("entry-count");
        var entryCount = 0;

        /* 级别严重度排序，数值越大越严重；低于 minRank 的条目被隐藏 */
        var RANK = { info: 1, warn: 2, error: 3, fatal: 3 };
        var minRank = 1;

        function rankOf(level) {
          return RANK[level] !== undefined ? RANK[level] : 1;
        }

        function applyFilter() {
          var items = list.querySelectorAll(".log-entry");
          for (var i = 0; i < items.length; i++) {
            items[i].style.display =
              rankOf(items[i].dataset.level) >= minRank ? "" : "none";
          }
        }

        function showEmpty(text) {
          list.innerHTML =
            '<div class="empty-hint">' +
            EMPTY_SVG +
            "<span>" +
            text +
            "</span></div>";
        }

        function hideEmpty() {
          var empty = list.querySelector(".empty-hint");
          if (empty) empty.remove();
        }

        function addEntry(e) {
          var level = e.level || "info";
          var div = document.createElement("div");
          div.className = "log-entry";
          div.innerHTML =
            '<span class="log-time">' +
            escapeHtml(e.time) +
            "</span>" +
            '<span class="log-level ' +
            escapeHtml(level) +
            '">' +
            escapeHtml(level) +
            "</span>" +
            '<span class="log-msg">' +
            escapeHtml(e.msg) +
            "</span>";
          hideEmpty();
          if (rankOf(level) < minRank) div.style.display = "none";
          div.dataset.level = level;
          list.appendChild(div);
          entryCount++;
          countEl.textContent = entryCount + " 条";
          var nearBottom =
            list.scrollTop + list.clientHeight >= list.scrollHeight - 50;
          if (nearBottom) list.scrollTop = list.scrollHeight;
        }

        var es = new EventSource("/stream");
        es.onmessage = function (ev) {
          try {
            addEntry(JSON.parse(ev.data));
          } catch (err) {
            /* 忽略坏帧 */
          }
        };
        es.onerror = function () {
          es.close();
          showEmpty("连接已断开");
        };

        document.addEventListener("keydown", function (ev) {
          if (ev.ctrlKey && ev.key === "l") {
            ev.preventDefault();
            entryCount = 0;
            countEl.textContent = "0 条";
            showEmpty("已清空，等待日志…");
          }
        });

        /* 级别筛选 chips：点击切换最低显示级别 */
        var filters = document.getElementById("filters");
        if (filters) {
          filters.addEventListener("click", function (ev) {
            var btn = ev.target.closest(".chip");
            if (!btn) return;
            var chips = filters.querySelectorAll(".chip");
            for (var i = 0; i < chips.length; i++) {
              chips[i].classList.toggle("active", chips[i] === btn);
            }
            minRank = rankOf(btn.dataset.min);
            applyFilter();
          });
        }

        /* ================= 设置面板 ================= */
        var KEYS = [
          "extract.bookmarks", "extract.software", "extract.system",
          "extract.drives", "extract.recent", "extract.office",
          "watch", "ahk", "interval_seconds"
        ];
        var viewLog = document.getElementById("view-log");
        var viewSettings = document.getElementById("view-settings");
        var statusEl = document.getElementById("save-status");
        var curCfg = null, defCfg = null, modMap = {};

        function showView(name) {
          var isSettings = name === "settings";
          viewLog.classList.toggle("hidden", isSettings);
          viewSettings.classList.toggle("hidden", !isSettings);
          var tabs = document.querySelectorAll(".tab");
          for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle("active", tabs[i].dataset.view === name);
          }
        }
        var tabBtns = document.querySelectorAll(".tab");
        for (var ti = 0; ti < tabBtns.length; ti++) {
          tabBtns[ti].addEventListener("click", function () {
            location.hash = this.dataset.view === "settings" ? "#settings" : "";
            showView(this.dataset.view);
          });
        }
        window.addEventListener("hashchange", function () {
          showView(location.hash === "#settings" ? "settings" : "log");
        });
        showView(location.hash === "#settings" ? "settings" : "log");

        function getPath(o, p) {
          var ks = p.split("."), t = o;
          for (var i = 0; i < ks.length; i++) {
            if (t == null) return undefined;
            t = t[ks[i]];
          }
          return t;
        }
        function setPath(o, p, v) {
          var ks = p.split("."), t = o;
          for (var i = 0; i < ks.length - 1; i++) t = t[ks[i]];
          t[ks[ks.length - 1]] = v;
        }

        function setStatus(msg, ok) {
          if (!msg) { statusEl.textContent = ""; return; }
          statusEl.textContent = msg;
          statusEl.className = ok ? "ok" : "err";
          setTimeout(function () { statusEl.textContent = ""; }, 3000);
        }

        function fillForm(cfg) {
          for (var i = 0; i < KEYS.length; i++) {
            var el = document.querySelector('[data-key="' + KEYS[i] + '"]');
            if (!el) continue;
            var v = getPath(cfg, KEYS[i]);
            if (el.type === "checkbox") el.checked = !!v;
            else el.value = v === undefined || v === null ? "" : v;
          }
          renderMarks();
        }

        /* 修改标记：黄条 + 单项重置按钮，仅对「当前值 ≠ 默认值」的项显示 */
        function renderMarks() {
          var rows = document.querySelectorAll("#view-settings .field");
          for (var i = 0; i < rows.length; i++) {
            var el = rows[i].querySelector("[data-key]");
            if (!el) continue;
            var mod = !!modMap[el.dataset.key];
            rows[i].classList.toggle("modified", mod);
            var btn = rows[i].querySelector(".reset-btn");
            if (btn) btn.style.display = mod ? "" : "none";
          }
        }

        function setControl(el, v) {
          if (el.type === "checkbox") el.checked = !!v;
          else el.value = v === undefined || v === null ? "" : v;
        }

        function loadSettings() {
          fetch("/api/config")
            .then(function (r) { return readAPIResponse(r); })
            .then(function (d) {
              curCfg = d.config; defCfg = d.defaults; modMap = d.modified || {};
              var ae = document.activeElement;
              var editing = ae && ae.closest && ae.closest("#view-settings") && ae.dataset && ae.dataset.key;
              // 正在编辑的控件不被覆盖；其余回显最新值
              for (var i = 0; i < KEYS.length; i++) {
                var k = KEYS[i];
                var el = document.querySelector('[data-key="' + k + '"]');
                if (!el || (editing && ae === el)) continue;
                setControl(el, getPath(curCfg, k));
              }
              renderMarks();
            })
            .catch(function (e) { setStatus(e && e.message ? e.message : "读取配置失败", false); });
        }

        /* 统一解析 API 响应：非 JSON（如误拿到 HTML）或 HTTP 错误一律抛出可见错误 */
        function readAPIResponse(r) {
          return r.text().then(function (t) {
            var ct = r.headers.get("Content-Type") || "";
            if (ct.indexOf("application/json") === -1 || t.charAt(0) !== "{") {
              throw new Error("服务端返回异常（版本过旧？请重新构建）");
            }
            var d = JSON.parse(t);
            if (!r.ok) throw new Error(d.error || "HTTP " + r.status);
            return d;
          });
        }

        function collect() {
          var c = JSON.parse(JSON.stringify(curCfg));
          for (var i = 0; i < KEYS.length; i++) {
            var k = KEYS[i];
            var el = document.querySelector('[data-key="' + k + '"]');
            if (!el) continue;
            var v;
            if (el.type === "checkbox") v = el.checked;
            else if (k === "interval_seconds") v = parseInt(el.value, 10) || 0;
            else v = el.value;
            setPath(c, k, v);
          }
          return c;
        }

        function save() {
          if (!curCfg || !defCfg) { setStatus("配置尚未加载，请稍候", false); return; }
          fetch("/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(collect())
          })
            .then(function (r) { return readAPIResponse(r); })
            .then(function (d) {
              if (!d.ok) throw new Error("服务端未确认保存");
              setStatus("已保存并生效", true);
              loadSettings();
            })
            .catch(function (e) { setStatus(e && e.message ? e.message : "保存失败", false); });
        }

        document.getElementById("btn-save").addEventListener("click", save);

        document.getElementById("btn-restore").addEventListener("click", function () {
          for (var i = 0; i < KEYS.length; i++) {
            var el = document.querySelector('[data-key="' + KEYS[i] + '"]');
            if (el) setControl(el, getPath(defCfg, KEYS[i]));
          }
          save();
        });

        document.getElementById("btn-clean").addEventListener("click", function () {
          fetch("/api/clean", { method: "POST" })
            .then(function (r) { return readAPIResponse(r); })
            .then(function (d) {
              if (!d.ok) throw new Error("服务端未确认");
              setStatus("已开始清理并重建，详见控制台日志", true);
            })
            .catch(function (e) { setStatus(e && e.message ? e.message : "清理失败", false); });
        });

        /* 单项重置：该项写回默认值并立即保存生效 */
        var resetBtns = document.querySelectorAll("#view-settings .reset-btn");
        for (var ri = 0; ri < resetBtns.length; ri++) {
          resetBtns[ri].addEventListener("click", function (ev) {
            ev.stopPropagation();
            var row = this.closest(".field");
            var el = row && row.querySelector("[data-key]");
            if (!el || !defCfg) return;            setControl(el, getPath(defCfg, el.dataset.key));
            save();
          });
        }

        loadSettings();
      })();
    </script>
  </body>
</html>
